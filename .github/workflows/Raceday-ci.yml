name: RaceDay CI

on:
  push:
    branches:
      - part-2-api
  pull_request:
    branches:
      - main
      - part-2-api
  workflow_dispatch:

jobs:
  build:
    name: Build RaceDay API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Locate project files
        run: |
          echo "Searching for C# project files..."
          find . -type f -name "*.csproj" \
            -not -path "*/bin/*" \
            -not -path "*/obj/*"

      - name: Restore and build
        shell: bash
        run: |
          mapfile -t projects < <(
            find . -type f -name "*.csproj" \
              -not -path "*/bin/*" \
              -not -path "*/obj/*"
          )

          if [ "${#projects[@]}" -eq 0 ]; then
            echo "ERROR: No C# project files found."
            exit 1
          fi

          for project in "${projects[@]}"; do
            echo "Restoring $project"
            dotnet restore "$project"

            echo "Building $project"
            dotnet build "$project" \
              --configuration Release \
              --no-restore
          done
