name: RaceDay CI

on:
  push:
    branches:
      - part-2-api

  pull_request:
    branches:
      - main
      - part-2-api

  workflow_dispatch:

jobs:
  build:
    name: Build RaceDay API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Locate project files
        run: |
          echo "Searching for .NET project files..."
          find . -type f -name "*.csproj" \
            -not -path "*/bin/*" \
            -not -path "*/obj/*"

      - name: Restore dependencies
        shell: bash
        run: |
          mapfile -t projects < <(
            find . -type f -name "*.csproj" \
              -not -path "*/bin/*" \
              -not -path "*/obj/*"
          )

          if [ "${#projects[@]}" -eq 0 ]; then
            echo "ERROR: No .csproj files found."
            exit 1
          fi

          for project in "${projects[@]}"; do
            dotnet restore "$project" || exit 1
          done

      - name: Build projects
        shell: bash
        run: |
          mapfile -t projects < <(
            find . -type f -name "*.csproj" \
              -not -path "*/bin/*" \
              -not -path "*/obj/*"
          )

          for project in "${projects[@]}"; do
            dotnet build "$project" \
              --configuration Release \
              --no-restore || exit 1
          done
