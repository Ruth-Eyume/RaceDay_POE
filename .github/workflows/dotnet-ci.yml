name: RaceDay API CI

on:
  push:
    branches:
      - main
      - part-2-api
  pull_request:
    branches:
      - main
      - part-2-api
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Verify .NET installation
        run: dotnet --info

      - name: Find project files
        id: projects
        shell: bash
        run: |
          find . -type f -name '*.csproj' \
            -not -path '*/bin/*' \
            -not -path '*/obj/*' \
            | sort > projects.txt

          if [ ! -s projects.txt ]; then
            echo "No C# project files were found in the repository."
            exit 1
          fi

          cat projects.txt

      - name: Restore dependencies
        shell: bash
        run: |
          while IFS= read -r project; do
            echo "Restoring $project"
            dotnet restore "$project"
          done < projects.txt

      - name: Build projects
        shell: bash
        run: |
          while IFS= read -r project; do
            echo "Building $project"
            dotnet build "$project" \
              --configuration Release \
              --no-restore
          done < projects.txt

      - name: Run tests
        shell: bash
        run: |
          while IFS= read -r project; do
            echo "Testing $project"
            dotnet test "$project" \
              --configuration Release \
              --no-build \
              --no-restore
          done < projects.txt

